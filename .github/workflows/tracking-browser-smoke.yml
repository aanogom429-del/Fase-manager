name: Tracking RC browser smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/tracking_browser_smoke.py'
      - '.github/workflows/tracking-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/tracking_browser_smoke.py

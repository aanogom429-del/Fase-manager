</svg><p id="status">Jugadores visibles. Iniciando simulación…</p><small>Versión experimental 0.4.1: apoyos, pases, conducciones, presión, interceptaciones y tiros. Las decisiones son heurísticas, no aprendizaje automático.</small></main><script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), ball=$('ball'), status=$('status'),clockEl=$('clock'),scoreEl=$('score');
const homes=[[0,1,6,32],[0,2,21,10],[0,3,21,24],[0,4,21,40],[0,5,21,54],[0,6,40,16],[0,7,38,32],[0,8,40,48],[0,9,63,12],[0,10,63,32],[0,11,63,52],[1,1,94,32],[1,2,79,54],[1,3,79,40],[1,4,79,24],[1,5,79,10],[1,6,60,48],[1,7,62,32],[1,8,60,16],[1,9,37,52],[1,10,37,32],[1,11,37,12]];
const players=homes.map(([t,n,x,y])=>({t,n,x,y,hx:x,hy:y,el:$('p'+t+'-'+n),speed:n===1?6.0:7.5+(n%4)*.45,cool:0}));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const opp=t=>players.filter(p=>p.t!==t);
const team=t=>players.filter(p=>p.t===t);
const nearest=(pos,list)=>list.reduce((best,p)=>!best||d(pos,p)<d(pos,best)?p:best,null);
const direction=t=>t===0?1:-1;
let owner=players[6],flight=null,bx=owner.x,by=owner.y,elapsed=0,decision=.6,running=true,last=0,score=[0,0],speed=1,passes=0,shots=0,turnovers=0,action='Inicio';
function report(msg){action=msg;status.textContent=msg+' · Pases '+passes+' · Tiros '+shots+' · Cambios de posesión '+turnovers;}
function resetKickoff(t){owner=team(t).find(p=>p.n===7);for(const p of players){p.x=p.hx;p.y=p.hy;p.cool=0;}owner.x=50-direction(t)*1.5;owner.y=32;bx=owner.x;by=owner.y;flight=null;decision=1;report('Saque de centro '+(t?'rojo':'azul'));}
function passLane(a,b,rivals){let risk=0;for(const r of rivals){const vx=b.x-a.x,vy=b.y-a.y,len2=vx*vx+vy*vy||1;const t=clamp(((r.x-a.x)*vx+(r.y-a.y)*vy)/len2,0,1);if(t<.08||t>.95)continue;const px=a.x+vx*t,py=a.y+vy*t;const gap=Math.hypot(r.x-px,r.y-py);if(gap<7)risk+= (7-gap)*(1.0+0.5*(1-t));}return risk;}
function kickTo(p,x,y,kind,target=null){const length=Math.hypot(x-p.x,y-p.y)||1;const duration=length/(kind==='shot'?48:kind==='pass'?35:29);flight={from:p,t:p.t,x:p.x,y:p.y,tx:x,ty:y,age:0,duration,kind,target,prevX:p.x,prevY:p.y};owner=null;decision=.55;p.cool=.55;if(kind==='pass'){passes++;report((p.t?'Rojo':'Azul')+' #'+p.n+' pasa'+(target?' a #'+target.n:''));}else{shots++;report((p.t?'Rojo':'Azul')+' #'+p.n+' remata');}}
function chooseAction(p){const rivals=opp(p.t),mates=team(p.t).filter(q=>q!==p&&q.n!==1),dir=direction(p.t),goalX=p.t?45:955;
 const nearestR=nearest(p,rivals),pressure=d(p,nearestR),goalDist=Math.abs((p.t?0:100)-p.x);
 if(goalDist<23&&Math.abs(p.y-32)<21&&Math.random()<.48){kickTo(p,p.t?-2:102,32+(Math.random()-.5)*12,'shot');return;}
 let best=null,bestScore=-Infinity;
 for(const m of mates){const length=d(p,m);if(length<5||length>49)continue;
 const advance=(m.x-p.x)*dir;
 const lane=passLane(p,m,rivals);
 const nearestM=d(m,nearest(m,rivals));
 const aheadOfDefense=clamp(advance,-20,25);
 const val=aheadOfDefense*.85+Math.min(nearestM,15)*1.3-lane*5-Math.abs(length-19)*.30+(m.n===10?2:0)+(Math.random()-.5)*8;
 if(val>bestScore){bestScore=val;best=m;}}
 if(best&&(bestScore>5||pressure<9||Math.random()<.55)){kickTo(p,best.x+direction(p.t)*Math.min(3,Math.max(0,pressure-4)*.25),best.y,'pass',best);return;}
 decision=pressure<8?.45:.85;
 p.driveX=clamp(p.x+dir*(pressure<8?3.5:7),3,97);p.driveY=clamp(p.y+(32-p.y)*.12,4,60);
 report((p.t?'Rojo':'Azul')+' #'+p.n+' conduce');
}
function movement(dt){const ballPos={x:bx,y:by};for(const p of players){p.cool=Math.max(0,p.cool-dt);let tx=p.hx,ty=p.hy;
 const attacking=owner?owner.t:(flight?flight.t:null);
 const dir=direction(p.t);
 if(p===owner){tx=p.driveX??p.x;ty=p.driveY??p.y;}
 else if(p.n===1){tx=p.hx;ty=clamp(by,23,41);}
 else if(attacking===p.t){const progress=(bx-50)*.32;
 tx=clamp(p.hx+progress+dir*(p.n>=9?4:1),5,95);
 ty=clamp(p.hy+(by-32)*.24,5,59);
 if(owner&&p!==owner){const sep=d(p,owner);if(sep<13){tx+=dir*(p.n%2?7:-6);ty+=p.n%2?7:-7;}}
 if(flight&&flight.target===p){tx=flight.tx;ty=flight.ty;}
 }else{
 const chasers=team(p.t).filter(q=>q.n!==1).sort((a,b)=>d(a,ballPos)-d(b,ballPos));
 const index=chasers.indexOf(p);
 if(index===0){tx=bx-dir*2;ty=by;}
 else if(index===1){tx=bx+dir*7;ty=by+(p.y<by?-7:7);}
 else{tx=clamp(p.hx+(bx-50)*.40,5,95);ty=clamp(p.hy+(by-32)*.35,5,59);
 const opponent=nearest(p,team(1-p.t).filter(q=>q.n!==1));if(opponent&&d(p,opponent)<16){tx=tx*.65+opponent.x*.35;ty=ty*.65+opponent.y*.35;}}
 }
 const dx=tx-p.x,dy=ty-p.y,dd=Math.hypot(dx,dy);if(dd>.08){const step=Math.min(dd,p.speed*dt);p.x=clamp(p.x+dx/dd*step,2,98);p.y=clamp(p.y+dy/dd*step,2,62);}
 }}
function capture(p,why){if(owner&&owner.t!==p.t)turnovers++;owner=p;flight=null;bx=p.x;by=p.y;decision=.3+Math.random()*.35;p.driveX=p.x;p.driveY=p.y;report((p.t?'Rojo':'Azul')+' #'+p.n+' '+why);}
function update(dt){elapsed+=dt;decision-=dt;
 if(owner){bx=owner.x;by=owner.y;if(decision<=0)chooseAction(owner);
 // Un pase o tiro deja el balón en vuelo y owner pasa a null.
 if(owner){const rivals=opp(owner.t).filter(p=>p.n!==1&&p.cool===0);const nearestR=nearest(owner,rivals);
 if(nearestR&&d(owner,nearestR)<2.8&&Math.random()<dt*(d(owner,nearestR)<1.7?.70:.27)){capture(nearestR,'recupera');}}}
 movement(dt);
 if(flight){const f=flight;f.age+=dt;const a=clamp(f.age/f.duration,0,1);const old={x:bx,y:by};bx=f.x+(f.tx-f.x)*a;by=f.y+(f.ty-f.y)*a;
 // Intercepción: proximidad al segmento recorrido durante este frame.
 const candidates=players.filter(p=>p!==f.from&&p.cool<=0&&p.n!==1);
 for(const p of candidates){const vx=bx-old.x,vy=by-old.y,ll=vx*vx+vy*vy||1;const u=clamp(((p.x-old.x)*vx+(p.y-old.y)*vy)/ll,0,1);const gap=Math.hypot(p.x-old.x-u*vx,p.y-old.y-u*vy);
 if(gap<(p.t===f.t?2.2:1.65)){capture(p,p.t===f.t?'recibe':'intercepta');break;}}
 if(flight&&a>=1){if(f.kind==='shot'){
 const inside=Math.abs(by-32)<5.1;
 const gk=team(1-f.t).find(p=>p.n===1);const save=inside&&Math.abs(gk.y-by)<4.5&&Math.random()<.55;
 if(inside&&!save){score[f.t]++;report('⚽ ¡GOL del equipo '+(f.t?'rojo':'azul')+'!');resetKickoff(1-f.t);}
 else{capture(gk,save?'detiene el remate':'saca de portería');}
 }else{const p=nearest({x:bx,y:by},players.filter(q=>q!==f.from));capture(p,p.t===f.t?'controla':'recupera un pase');}}
 }
 if(!flight&&!owner){const p=nearest({x:bx,y:by},players);capture(p,'controla');}
 if(owner&&(owner.x<2||owner.x>98||owner.y<2||owner.y>62)){owner.x=clamp(owner.x,3,97);owner.y=clamp(owner.y,3,61);}
}
function render(){for(const p of players)p.el.setAttribute('transform',`translate(${(45+p.x*9.1).toFixed(1)} ${(34+p.y*9.1).toFixed(1)})`);ball.setAttribute('cx',(45+bx*9.1).toFixed(1));ball.setAttribute('cy',(34+by*9.1).toFixed(1));const s=Math.floor(elapsed);clockEl.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');scoreEl.textContent=score.join(' - ');}
function frame(now){
 if(!last)last=now;
 const dt=Math.min(.05,(now-last)/1000);last=now;
 try { if(running)update(dt*speed); render(); }
 catch(err){ running=false; $('pause').textContent='▶ Continuar'; status.textContent='⚠️ ERROR DEL MOTOR: '+(err&&err.message?err.message:String(err))+' · Revisa esta frase y envíame una captura.'; status.style.color='#ffb0a9'; console.error('FASE MANAGER',err); }
 requestAnimationFrame(frame);
}
$('pause').onclick=()=>{running=!running;$('pause').textContent=running?'⏸ Pausar':'▶ Continuar';};
$('restart').onclick=()=>{elapsed=0;score=[0,0];passes=shots=turnovers=0;resetKickoff(0);};
$('speed').onchange=e=>speed=Number(e.target.value);
report('Simulación iniciada');render();requestAnimationFrame(frame);
})();
</script></body></html>
